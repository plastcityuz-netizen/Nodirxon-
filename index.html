function childPills(){
  return `<div class="child-pills">${CONFIG.children.map(c=>`<button class="child-pill ${c.id===state.child?"active":""}" data-action="child" data-child="${c.id}">${avatar(c.initials,c.grad,"sm")}<span><b>${esc(c.short)}</b><small>${esc(c.klass)}</small></span></button>`).join("")}</div>`;
}
function lineChart(values,labels,color="#14B8A6"){
  const w=560,h=180,pad=28,max=Math.max(...values,5.2),min=Math.min(...values,2.5);
  const pts=values.map((v,i)=>[pad+i*(w-2*pad)/(values.length-1),h-pad-((v-min)/(max-min||1))*(h-2*pad)]);
  const poly=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area=`${pad},${h-pad} ${poly} ${w-pad},${h-pad}`;
  return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${L("Baholar trendi|Тренд оценок|Grade trend")}">
    <defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0,1,2,3].map(i=>`<line x1="${pad}" y1="${pad+i*(h-2*pad)/3}" x2="${w-pad}" y2="${pad+i*(h-2*pad)/3}" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 5"/>`).join("")}
    ${[5,4,3].map((v,i)=>`<text x="5" y="${pad+i*(h-2*pad)/3+4}" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
    <polygon points="${area}" fill="url(#chartFill)"/>
    <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/>`).join("")}
    ${labels.map((l,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(l)}</text>`).join("")}
  </svg></div>`;
}
function gradeTrend(child){
  const weeks=[5,4,3,2,1,0].map(k=>{
    const from=addDays(TODAY,-k*7-7),to=addDays(TODAY,-k*7);
    const list=DATA.grades[child].filter(g=>g.date>=from&&g.date<=to);
    return list.length?list.reduce((a,g)=>a+g.value,0)/list.length:4.2;
  });
  return lineChart(weeks,["5 hafta","4 hafta","3 hafta","2 hafta","1 hafta","Bugun"]);
}

VIEWS.messages=function(){
  const threads=DATA.threads[state.child]||[];
  if(!state.chatThread||!threads.find(x=>x.id===state.chatThread)) state.chatThread=threads[0]?.id||null;
  const th=threads.find(x=>x.id===state.chatThread)||threads[0];
  const msgs=th?th.messages.concat(state.chatExtra[th.id]||[]):[];
  const threadHTML=threads.map(x=>{
    const unread=state.threadsRead[x.id]?0:x.unread;
    const last=msgsLast(x);
    return `<button class="thread ${x.id===state.chatThread?"active":""}" data-action="thread-open" data-id="${x.id}">
      ${avatar(x.initials,x.grad)}<span class="grow"><b>${esc(x.title)}</b><small>${esc(last.text)}</small></span>
      <span class="col" style="align-items:flex-end;gap:.3rem"><small class="t-time">${esc(last.time)}</small>${unread?`<span class="badge-count">${unread}</span>`:""}</span></button>`;
  }).join("");
  const bubbles=msgs.map(m=>`<div class="msg ${m.from==="me"?"me":""}">
      ${m.from==="them"?avatar(th.initials,th.grad,"sm"):""}
      <div><div class="bubble">${esc(m.text)}</div><div class="msg-meta">${esc(m.time)} ${m.from==="me"?`<span class="read-check" title="${L("O‘qildi|Прочитано|Read")}">${icon("check",12)}${icon("check",12)}</span>`:""}</div></div></div>`).join("");
  return `${pageHead("messages",`<span class="chip teal">${icon("message",13)} ${unreadThreads()} ${t("common.unread")}</span>`)}${childPills()}
    <div class="chat-layout mt-2">
      <div class="thread-list"><div class="drop-title" style="padding:.6rem">${L("Muloqotlar|Диалоги|Conversations")}</div>${threadHTML}
        <div class="divider"></div><div style="padding:.5rem"><a class="btn btn-soft btn-sm btn-block" href="${sectionLink("meetings")}">${icon("users",14)} ${L("Uchrashuvga yozilish|Записаться на встречу|Book a meeting")}</a></div></div>

        <div class="chat-head">${avatar(th.initials,th.grad)}<div class="grow"><b class="small">${esc(th.title)}</b><small class="muted tiny">${esc(th.role)} · ${esc(childObj().klass)}</small></div>
          <span class="chip ok">${icon("dot",10)} ${L("Onlayn|В сети|Online")}</span>
          <a class="btn-icon" href="tel:${CONFIG.school.phone.replace(/\s/g,"")}" aria-label="${t("misc.call")}">${icon("phone",17)}</a></div>
        <div class="chat-body" id="chatBody">${bubbles}</div>
        <div class="composer">
          <div class="template-chips">${DATA.chatTemplates.map((tp,i)=>`<button class="chip-btn" data-action="template" data-idx="${i}">${icon("sparkles",12)} ${esc(tp.t)}</button>`).join("")}</div>

            <input class="input grow" data-role="msg-input" placeholder="${L("Xabar yozing...|Напишите сообщение...|Write a message...")}" value="${esc(state.chatDraft||"")}" autocomplete="off">
            <button class="btn btn-primary btn-icon" type="submit" aria-label="${t("common.send")}">${icon("send",18)}</button></form>

function msgsLast(th){
  const extra=state.chatExtra[th.id]||[];
  return extra.length?extra[extra.length-1]:th.messages[th.messages.length-1];
}

function icsDate(d,time){
  const [h,m]=String(time||"09:00").replace(":","").match(/../g)||["09","00"];
  const pad=x=>String(x).padStart(2,"0");
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${h}${m}00`;
}
function makeICS(title,desc,place,date,time){
  const start=icsDate(date,time),end=icsDate(date,String(parseInt(time.slice(0,2),10)+1).padStart(2,"0")+time.slice(2));
  const stamp=icsDate(TODAY,"08:00");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Nur Ziyo//Parent Portal//UZ","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${Date.now()}@nurziyo.uz`,`DTSTAMP:${stamp}`,`DTSTART:${start}`,`DTEND:${end}`,
    `SUMMARY:${title}`,`DESCRIPTION:${desc}`,`LOCATION:${place}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
}

function setupSignature(){
  const cv=$("#signCanvas"); if(!cv||typeof cv.getContext!=="function")return;
  let ctx=null; try{ctx=cv.getContext("2d");}catch(e){return;} if(!ctx)return;
  cv.width=cv.offsetWidth||480;cv.height=130;
  ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0F1B3D";
  let drawing=false;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top];};
  const start=e=>{e.preventDefault();drawing=true;const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);};
  const move=e=>{if(!drawing)return;e.preventDefault();const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();};
  const end=()=>{drawing=false;};
  ["mousedown","touchstart","pointerdown"].forEach(ev=>cv.addEventListener(ev,start,{passive:false}));
  ["mousemove","touchmove","pointermove"].forEach(ev=>cv.addEventListener(ev,move,{passive:false}));
  ["mouseup","touchend","pointerup","pointerleave"].forEach(ev=>cv.addEventListener(ev,end));
}

function setChild(id){

function handleClick(e){
  const el=e.target.closest("[data-action]");
  if(!el){
    if(state.notifOpen||state.childOpen||state.searchOpen){
      if(!e.target.closest(".drop-anchor")){state.notifOpen=false;state.childOpen=false;state.searchOpen=false;render({keepScroll:true});}
    }
    return;
  }
  const a=el.dataset.action,d=el.dataset;
  if(a==="modal-backdrop"){ if(e.target===el) closeModal(); return; }
  switch(a){
    /* ---- Navigation & chrome ---- */
    case "nav": e.preventDefault();go(d.route);break;
    case "scroll": {e.preventDefault();const tgt=$(d.target);if(tgt)tgt.scrollIntoView({behavior:"smooth",block:"start"});$("#lpMobileNav")?.classList.add("hide");break;}
    case "lp-menu": {$("#lpMobileNav")?.classList.toggle("hide");break;}
    case "drawer-open": state.drawerOpen=true;renderDrawer();break;
    case "drawer-close": state.drawerOpen=false;renderDrawer();break;
    case "theme": state.theme=state.theme==="dark"?"light":"dark";savePrefs();render({keepScroll:true});toast(t("toast.theme"));break;
    case "font": {const v=Number(d.delta);state.font=v<0?0.9:v>0?1.12:1;savePrefs();render({keepScroll:true});break;}
    case "child": setChild(d.child);break;
    case "child-toggle": state.childOpen=!state.childOpen;state.notifOpen=false;renderTopbar();break;
    case "notif-toggle": state.notifOpen=!state.notifOpen;state.childOpen=false;renderTopbar();break;
    case "mark-all-read": state.notifications.forEach(n=>n.read=true);state.notifOpen=false;saveData();render({keepScroll:true});toast(t("toast.marked"));break;
    case "notif-read": {const n=state.notifications.find(x=>x.id===d.id);if(n)n.read=true;saveData();render({keepScroll:true});break;}
    case "logout": confirmDo(t("common.logout"),L("Kabinetdan chiqmoqchimisiz?|Выйти из кабинета?|Sign out of the portal?"),()=>{
        state.authed=false;try{localStorage.removeItem(SESSION_KEY);}catch(err){}
        state.aiMessages=[];go("/");toast(t("toast.loggedOut"));});break;
    case "toast-close": el.closest(".toast")?.remove();break;
    case "modal-close": closeModal();break;
    case "confirm-yes": {const fn=state.pendingConfirm;closeModal();if(typeof fn==="function")fn();break;}
    case "telegram": {try{window.open("https://t.me/nurziyo_school","_blank","noopener");toast(t("misc.telegram"),CONFIG.school.telegram);}catch(err){toast(t("misc.telegram"),CONFIG.school.telegram);}break;}
    case "faq":
    case "exam-tip": el.closest(".faq-item")?.classList.toggle("open");break;
    /* ---- Auth ---- */
    case "quick-login": state.authed=true;try{localStorage.setItem(SESSION_KEY,"1");}catch(err){}state.authStep=1;go("/app/dashboard");toast(t("toast.loggedIn"),CONFIG.parent.name);break;
    case "auth-back": state.authStep=1;render({keepScroll:true});break;
    case "resend": toast(t("auth.resend"),`${t("auth.demoHint")}`,"warn");break;
    /* ---- Search ---- */
    case "search-result": state.searchOpen=false;state.searchQuery="";go("/app/"+d.view);break;
    case "search-go": state.searchOpen=false;go("/app/search");break;
    case "search-quick": state.searchQuery=d.q;render({keepScroll:true});break;
    /* ---- AI ---- */
    case "ai-toggle": state.aiOpen=!state.aiOpen;renderAI();break;
    case "ai-ask": aiSend(d.q);break;
    /* ---- Learning ---- */
    case "schedule-day": state.scheduleDay=d.d==="all"?"all":Number(d.d);render({keepScroll:true});break;
    case "grade-quarter": state.gradeQuarter=Number(d.q);render({keepScroll:true});break;
    case "print-report": printSheet(reportCardHTML());break;
    case "attendance-day": attendanceDayModal(Number(d.day));break;
    case "hw-toggle": {const h=DATA.homework[state.child].find(x=>x.id===d.id);if(!h)break;const cur=state.hwState[h.id]||h.status;state.hwState[h.id]=cur==="done"?"todo":"done";saveData();render({keepScroll:true});toast(t("toast.marked"),state.hwState[h.id]==="done"?t("common.done"):L("Bajarilmadi|Не выполнено|To do"));break;}
    case "hw-filter": state.homeworkFilter=d.v;render({keepScroll:true});break;
    case "hw-download": downloadFile(d.file,`${CONFIG.school.name}\n${L("Uy vazifasi|Домашнее задание|Homework")}: ${d.id}\n${L("Fayl|Файл|File")}: ${d.file}\n${fmtFull(TODAY)}`);toast(t("toast.download"),d.file);break;
    /* ---- Payments ---- */
    case "pay-open": payModal(d.id,d.provider);break;
    case "pay-confirm": {
      if(!state.paidInvoices.includes(d.id))state.paidInvoices.push(d.id);
      saveData();closeModal();render({keepScroll:true});
      toast(t("toast.paid"),`${DATA.paymentProviders.find(p=>p.id===d.provider)?.name||""} · ${money(DATA.payments.find(p=>p.id===d.id)?.amount||0)}`);
      const inv=DATA.payments.find(p=>p.id===d.id);
      openModal({title:`${icon("checkCircle",20)} ${t("toast.paid")}`,
        body:`<div class="center" style="padding:.5rem"><div class="badge-medal grad-1" style="margin:0 auto 1rem">${icon("check",32)}</div><h3 class="bold">${t("toast.paid")}</h3><p class="small muted mt-1">${esc(inv.label)} · ${money(inv.amount)} · ${esc(inv.receipt)}</p></div>`,
        footer:`<button class="btn btn-ghost" data-action="modal-close">${t("common.close")}</button><button class="btn btn-primary" data-action="receipt" data-id="${inv.id}">${icon("print",15)} ${t("misc.receipt")}</button>`});
      break;}
    case "receipt": {closeModal();printSheet(receiptHTML(DATA.payments.find(p=>p.id===d.id)||DATA.payments[0]));break;}
    case "print-statement": printSheet(statementHTML());break;
    /* ---- News & events ---- */
    case "news-open": newsModal(d.id);break;
    case "news-filter": state.newsFilter=d.v;render({keepScroll:true});break;
    case "news-read-all": DATA.news.forEach(n=>state.newsRead[n.id]=true);saveData();render({keepScroll:true});toast(t("toast.marked"));break;
    case "events-filter": state.eventsFilter=d.v;render({keepScroll:true});break;
    case "rsvp": state.rsvp[d.id]=d.v;saveData();render({keepScroll:true});toast(t("toast.saved"),d.v==="yes"?t("misc.go"):t("misc.notGo"));break;
    case "ics": {const ev=DATA.events.find(x=>x.id===d.id);if(ev){downloadFile(`nurziyo-${ev.id}.ics`,makeICS(ev.title,ev.desc,ev.place,addDays(TODAY,ev.days),ev.hour==="—"?"09:00":ev.hour),"text/calendar;charset=utf-8");toast(t("misc.addCalendar"),ev.title);}break;}
    case "ics-exam": {const ex=DATA.exams.find(x=>x.id===d.id);if(ex){downloadFile(`nurziyo-${ex.id}.ics`,makeICS(`${ex.subject} · ${ex.type}`,ex.topics,ex.room,addDays(TODAY,ex.days),ex.time),"text/calendar;charset=utf-8");toast(t("misc.addCalendar"),ex.subject);}break;}
    /* ---- Meetings ---- */
    case "meeting-teacher": state.meetingTeacher=d.id;state.meetingSlot=null;render({keepScroll:true});break;
    case "meeting-date": state.meetingDate=d.date;state.meetingSlot=null;render({keepScroll:true});break;
    case "meeting-slot": state.meetingSlot=d.slot;render({keepScroll:true});break;
    case "meeting-book": {
      if(!state.meetingSlot){toast(t("common.choose"),L("Vaqt slotini tanlang|Выберите время|Pick a time slot"),"warn");break;}
      const tc=DATA.meetingTeachers.find(x=>x.id===state.meetingTeacher)||DATA.meetingTeachers[0];
      state.bookings.push({teacher:tc.name,date:state.meetingDate,slot:state.meetingSlot,child:childObj().name});
      const slot=state.meetingSlot;state.meetingSlot=null;saveData();render({keepScroll:true});
      toast(t("toast.booked"),`${tc.name} · ${state.meetingDate} · ${slot}`);
      openModal({title:`${icon("checkCircle",20)} ${t("toast.booked")}`,
        body:`<div class="rec-card"><span class="rc-ico">${icon("calendarPlus",20)}</span><div><b>${esc(tc.name)}</b><p class="small muted mt-1">${esc(state.meetingDate)} · ${esc(slot)} · ${esc(childObj().name)}<br>${L("Uchrashuv 20 daqiqa davom etadi.|Встреча длится 20 минут.|The meeting lasts 20 minutes.")}</p></div></div>`,
        footer:`<button class="btn btn-primary" data-action="modal-close">${t("common.close")}</button>`});break;}
    case "booking-cancel": confirmDo(t("common.cancel"),L("Ushbu yozilishni bekor qilmoqchimisiz?|Отменить эту запись?|Cancel this booking?"),()=>{
        state.bookings.splice(Number(d.idx),1);saveData();render({keepScroll:true});toast(t("toast.removed"));});break;
    /* ---- Meals / transport / health ---- */
    case "meal-day": state.mealDay=Number(d.d);render({keepScroll:true});break;
    case "allergy": {const i=state.allergies.indexOf(d.name);if(i>=0)state.allergies.splice(i,1);else state.allergies.push(d.name);saveData();render({keepScroll:true});toast(t("toast.saved"));break;}
    case "request-visit": openModal({title:`${icon("heart",20)} ${L("Ko‘rikka yozilish|Записаться на осмотр|Request a checkup")}`,
      body:`<form data-role="visit-form" class="col" style="gap:.85rem"><div class="field"><label>${t("common.date")}</label><select class="select" name="date">${[1,2,3,4,5].map(i=>`<option>${fmtDate(addDays(TODAY,i))}</option>`).join("")}</select></div>
        <div class="field"><label>${L("Sabab|Причина|Reason")}</label><textarea class="textarea" name="note" placeholder="${L("Ixtiyoriy|Необязательно|Optional")}"></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">${icon("calendarPlus",15)} ${t("toast.booked")}</button></form>`});break;
    case "perm-sign": state.signedPerms[state.child+"-"+d.id]=true;saveData();render({keepScroll:true});toast(t("toast.signed"));break;
    /* ---- Clubs / documents ---- */
    case "club-enroll": {const arr=state.enrolled[state.child]||(state.enrolled[state.child]=[]);
      if(arr.includes(d.id)){toast(t("common.enrolled"),L("Bu to‘garakka allaqachon yozilgansiz.|Вы уже записаны.|Already enrolled."),"warn");break;}
      arr.push(d.id);saveData();render({keepScroll:true});toast(t("toast.enrolled"),DATA.clubs.find(c=>c.id===d.id)?.name||"");break;}
    case "club-withdraw": confirmDo(L("To‘garakdan chiqish|Выйти из кружка|Leave club"),L("Farzandingiz ushbu to‘garakdan chiqarilsinmi?|Убрать ребёнка из этого кружка?|Remove your child from this club?"),()=>{
        state.enrolled[state.child]=(state.enrolled[state.child]||[]).filter(x=>x!==d.id);saveData();render({keepScroll:true});toast(t("toast.removed"));});break;
    case "doc-sign": signModal(d.id);break;
    case "sign-clear": {const cv=$("#signCanvas");if(cv&&typeof cv.getContext==="function"){try{const ctx=cv.getContext("2d");if(ctx)ctx.clearRect(0,0,cv.width,cv.height);}catch(err){}}break;}
    case "sign-submit": {
      const name=$("#signName")?.value||"",agree=$("#signAgree")?.checked;
      if(!name.trim()){toast(t("toast.needText"),"","warn");break;}
      if(!agree){toast(L("Tasdiqlash kerak|Нужно подтверждение|Please confirm"),"","warn");break;}
      state.signedDocs[d.id]=true;saveData();closeModal();render({keepScroll:true});toast(t("toast.signed"),name);break;}
    case "doc-download": {const doc=DATA.documents.find(x=>x.id===d.id);if(doc){
        downloadFile(`${doc.name.replace(/[^\w\u0400-\u04FF'’‘ ]+/g,"_")}.txt`,
          `${CONFIG.school.name}\n${"=".repeat(42)}\n${doc.name}\n${doc.type} · ${doc.date} · ${doc.ext}\n\n${L("Ushbu hujjat ota-onalar kabinetining demo nusxasi.|Демо-копия документа из кабинета родителей.|Demo copy from the parent portal.")}\n${L("O‘quvchi|Ученик|Student")}: ${childObj().name} (${childObj().klass})\n${L("Sana|Дата|Date")}: ${fmtFull(TODAY)}`);
        toast(t("toast.download"),doc.name);}break;}
    /* ---- Feedback / notifications ---- */
    case "ticket-filter": state.ticketFilter=d.v;render({keepScroll:true});break;
    case "notif-filter": state.notifFilter=d.v;render({keepScroll:true});break;
    case "notif-setting": state.notifSettings[d.key]=!state.notifSettings[d.key];saveData();render({keepScroll:true});toast(t("toast.saved"));break;
    /* ---- Profile ---- */
    case "profile-edit": state.profileEdit=!state.profileEdit;render({keepScroll:true});break;
    case "person-add": personModal(d.kind);break;
    case "person-remove": confirmDo(t("common.delete"),L("Ushbu shaxsni ro‘yxatdan o‘chirmoqchimisiz?|Удалить этого человека из списка?|Remove this person from the list?"),()=>{
        const arr=d.kind==="pickup"?state.pickup:state.emergency;
        const i=arr.findIndex(x=>x.id===d.id);if(i>=0)arr.splice(i,1);saveData();render({keepScroll:true});toast(t("toast.removed"));});break;
    case "pin-change": openModal({title:`${icon("lock",20)} ${t("misc.changePin")}`,
      body:`<form data-role="pin-form" class="col" style="gap:.9rem"><div class="field"><label>${L("Yangi PIN (4 raqam)|Новый ПИН (4 цифры)|New 4-digit PIN")}</label><input class="input" name="pin" inputmode="numeric" maxlength="4" required placeholder="••••"></div>
        <div class="field"><label>${L("PINni tasdiqlang|Подтвердите ПИН|Confirm PIN")}</label><input class="input" name="confirm" inputmode="numeric" maxlength="4" required placeholder="••••"></div>
        <button class="btn btn-primary btn-block" type="submit">${icon("check",15)} ${t("common.save")}</button></form>`});break;
    /* ---- Chat ---- */
    case "thread-open": state.chatThread=d.id;state.threadsRead[d.id]=true;saveData();render({keepScroll:true});
      {const cb=$("#chatBody");if(cb)cb.scrollTop=cb.scrollHeight;}break;
    case "template": state.chatDraft=DATA.chatTemplates[Number(d.idx)].m;render({keepScroll:true});break;
    case "msg-attach": {
      const inp=document.createElement("input");inp.type="file";inp.style.display="none";
      inp.addEventListener("change",()=>{
        const f=inp.files&&inp.files[0];if(!f)return;
        pushChatMessage({from:"me",text:`${L("Fayl biriktirildi|Файл прикреплён|File attached")}: ${f.name}`,time:nowTime(),read:false});
        render({keepScroll:true});toast(t("toast.added"),f.name);
      });
      document.body.appendChild(inp);inp.click();setTimeout(()=>inp.remove(),1000);break;}
    default: break;
  }
}
function nowTime(){const d=new Date();return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
function pushChatMessage(m){
  const id=state.chatThread||(DATA.threads[state.child][0]||{}).id;if(!id)return;
  (state.chatExtra[id]=state.chatExtra[id]||[]).push(m);
  saveData();
}
function chatAutoReply(){
  const th=(DATA.threads[state.child]||[]).find(x=>x.id===state.chatThread);if(!th)return;
  const replies=L("Rahmat, xabaringizni oldim. Tez orada batafsil javob beraman.|Спасибо, сообщение получил(а). Скоро отвечу подробнее.|Thank you, I've received your message. I'll reply in detail shortly.");
  pushChatMessage({from:"them",text:replies,time:nowTime()});
  render({keepScroll:true});
  const cb=$("#chatBody");if(cb)cb.scrollTop=cb.scrollHeight;
}

/* ---------- FORM SUBMISSIONS ---------- */
function handleSubmit(e){
  const form=e.target.closest("form[data-role]");if(!form)return;
  e.preventDefault();
  const role=form.dataset.role,fd=new FormData(form);
  switch(role){
    case "login-form": {
      const raw=String(fd.get("phone")||""); // phone input has no name -> fallback
      const val=$("[data-role=phone]",form)?.value||raw||"90 123 45 67";
      const digits=val.replace(/\D/g,"").slice(0,9);
      if(digits.length<9){toast(L("Raqamni to‘liq kiriting|Введите полный номер|Enter the full number"),"","warn");break;}
      state.authPhone="+998 "+digits.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/,"$1 $2 $3 $4");
      state.authStep=2;render({keepScroll:true});
      toast(L("SMS kod yuborildi|СМС-код отправлен|SMS code sent"),`${t("auth.demoHint")}`);break;}
    case "code-form": {
      const code=$$("[data-role=otp]",form).map(i=>i.value).join("");
      if(code!==CONFIG.smsCode){toast(t("auth.wrongCode"),"","error");break;}
      state.authed=true;state.authStep=1;
      try{if(state.remember)localStorage.setItem(SESSION_KEY,"1");}catch(err){}
      go("/app/dashboard");toast(t("toast.loggedIn"),state.parentData.name);break;}
    case "register-form": toast(t("auth.registerDone"),"","success");go("/login");break;
    case "absence-form": {
      const day=Number(fd.get("day")||TODAY.getDate()),reason=String(fd.get("reason")||""),note=String(fd.get("note")||"");
      state.absenceForms.push({day,reason,note,date:fmtDate(TODAY),child:state.child});
      DATA.attendance[state.child][day]="excused";
      saveData();closeModal();render({keepScroll:true});toast(t("toast.sent"),`${day} · ${reason}`);break;}
    case "feedback-form": {
      const title=String(fd.get("title")||"").trim(),text=String(fd.get("text")||"").trim();
      if(!title||!text){toast(t("toast.needText"),"","warn");break;}
      state.tickets.unshift({id:"NZ-"+(1050+state.tickets.length),cat:String(fd.get("category")||""),title,text,
        date:fmtDate(TODAY).replace(/ \d{4}$/," "+TODAY.getFullYear()),anon:!!fd.get("anon"),status:"new"});
      saveData();render({keepScroll:true});toast(t("toast.sent"),L("Murojaatingiz qabul qilindi|Обращение принято|Request received"));break;}
    case "profile-form": {
      state.parentData={...state.parentData,name:String(fd.get("name")||state.parentData.name),
        phone:String(fd.get("phone")||state.parentData.phone),email:String(fd.get("email")||state.parentData.email),
        address:String(fd.get("address")||state.parentData.address)};
      state.parentData.initials=state.parentData.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
      state.profileEdit=false;saveData();render({keepScroll:true});toast(t("toast.saved"));break;}
    case "person-form": {
      const name=String(fd.get("name")||"").trim(),phone=String(fd.get("phone")||"").trim(),roleV=String(fd.get("role")||"").trim();
      if(!name||!phone)break;
      const initials=name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
      const item={id:"p"+Date.now(),name,phone,role:roleV,relation:roleV,initials,grad:["grad-1","grad-3","grad-5","grad-6"][Math.floor(Math.random()*4)]};
      (form.dataset.kind==="pickup"?state.pickup:state.emergency).push(item);
      saveData();closeModal();render({keepScroll:true});toast(t("toast.added"),name);break;}
    case "pin-form": {
      const pin=String(fd.get("pin")||""),conf=String(fd.get("confirm")||"");
      if(pin.length!==4||pin!==conf){toast(L("PINlar mos kelmadi|ПИН-коды не совпадают|PINs do not match"),"","error");break;}
      closeModal();toast(t("toast.saved"),t("misc.pin"));break;}
    case "visit-form": {
      const dateV=String(fd.get("date")||"");
      state.notifications.unshift({id:"no"+Date.now(),type:"health",icon:"heart",color:"danger",
        title:L("Ko‘rikka yozilish|Запись на осмотр|Checkup booked"),text:`${L("Shifokor ko‘rigi|Медосмотр|Medical checkup")}: ${dateV}`,time:nowTime(),read:false});
      closeModal();render({keepScroll:true});toast(t("toast.booked"),dateV);break;}
    case "msg-form": {
      const inp=$("[data-role=msg-input]",form)||$('[data-role="msg-input"]');
      const text=String(inp?.value||state.chatDraft||"").trim();
      if(!text){toast(t("toast.needText"),"","warn");break;}
      pushChatMessage({from:"me",text,time:nowTime(),read:false});
      state.chatDraft="";state.chatThread=state.chatThread||(DATA.threads[state.child][0]||{}).id;
      render({keepScroll:true});toast(t("toast.sent"));
      const cb=$("#chatBody");if(cb)cb.scrollTop=cb.scrollHeight;
      setTimeout(()=>{if(state.route.startsWith("/app"))chatAutoReply();},1500);break;}
    case "ai-form": {const inp=$("[data-role=ai-input]",form);aiSend(inp?.value||"");break;}
    case "search-form": {const inp=$("[data-role=global-search]",form)||$('[data-role="global-search"]');state.searchQuery=String(inp?.value||"");render({keepScroll:true});break;}
    default: break;
  }
}

/* ---------- INPUT / CHANGE EVENTS ---------- */
function searchPageResults(q){
  const items=searchItems(q),grouped={};
  items.forEach(i=>{(grouped[i.type]=grouped[i.type]||[]).push(i);});
  if(!q.trim())return `<div>${emptyState(t("misc.searchHint"),L("Yuqoridagi maydonga so‘z yozing — natijalar darhol chiqadi.|Начните вводить запрос — результаты появятся сразу.|Start typing above — results appear instantly."),"search")}</div>`;
  if(!items.length)return `<div>${emptyState(t("toast.noResults"),L("Boshqa so‘z bilan qidirib ko‘ring.|Попробуйте другой запрос.|Try a different search term."))}</div>`;
  return Object.keys(grouped).map(k=>`<div class="search-group-title">${esc(L(SEARCH_TYPE_LABEL[k]||k))} · ${grouped[k].length}</div>${grouped[k].map(i=>searchRow(i)).join("")}`).join("");
}
function handleInput(e){
  const el=e.target,role=el.dataset.role;
  if(!role)return;
  if(role==="phone"){
    const digits=el.value.replace(/\D/g,"").slice(0,9);
    const f=digits.replace(/^(\d{2})(\d{3})(\d{2})(\d{2}).*/,"$1 $2 $3 $4").trim();
    if(el.value!==f)el.value=f;
  }
  if(role==="otp"){
    el.value=el.value.replace(/\D/g,"").slice(-1);
    const idx=Number(el.dataset.idx);
    if(el.value&&idx<3){const next=$(`[data-role=otp][data-idx="${idx+1}"]`);next?.focus();}
  }
  if(role==="global-search"){
    state.searchQuery=el.value;state.searchOpen=true;
    if(state.view==="search"){
      const wrap=$("#searchPageResults");if(wrap)wrap.innerHTML=searchPageResults(el.value);
    }
    const box=el.closest(".search-box");
    if(box&&box.closest(".topbar")){
      let drop=$("#searchResults");
      if(!drop){drop=document.createElement("div");drop.id="searchResults";drop.className="search-results";box.appendChild(drop);}
      drop.innerHTML=searchResultsHTML(el.value,true)+`<button class="btn btn-soft btn-sm btn-block mt-1" data-action="search-go">${t("common.viewAll")} ${icon("arrowRight",14)}</button>`;
    }
  }
  if(role==="msg-input")state.chatDraft=el.value;
}
function handleChange(e){
  const el=e.target,role=el.dataset.role;
  if(role==="lang"){
    state.lang=el.value;state.aiMessages=[];savePrefs();render({keepScroll:true});toast(t("toast.lang"),LANG_LABEL[state.lang]);return;
  }
  if(role==="remember"){state.remember=el.checked;return;}
  if(el.type==="file")return;
}
function handleKeydown(e){
  if(e.key==="Escape"){
    if(state.modal){closeModal();return;}
    if(state.drawerOpen){state.drawerOpen=false;renderDrawer();return;}
    if(state.aiOpen){state.aiOpen=false;renderAI();return;}
    if(state.notifOpen||state.childOpen||state.searchOpen){state.notifOpen=false;state.childOpen=false;state.searchOpen=false;renderTopbar();return;}
  }
  if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)){
    const s=$("#globalSearch");if(s){e.preventDefault();s.focus();}
  }
}

/* ==========================================================================
   19. BOOTSTRAP
   ========================================================================== */
document.addEventListener("click",handleClick);
document.addEventListener("submit",handleSubmit);
document.addEventListener("input",handleInput);
document.addEventListener("change",handleChange);
document.addEventListener("keydown",handleKeydown);
window.addEventListener("hashchange",router);
if(!location.hash) location.hash="#/";
router();
</script>
</body>
